name: Platform validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated develop revision to Railway
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  change-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      validate: ${{ steps.scope.outputs.validate }}
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Classify the complete change range
        id: scope
        run: node scripts/ci/change-scope.cjs
  local-platform:
    needs: change-scope
    if: needs.change-scope.outputs.validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install locked tooling
        run: |
          npm install --global npm@10.9.2
          npm ci
          npx playwright install --with-deps chromium
      - name: Check repository secrets
        run: npm run check:secrets
      - name: Validate complete local platform
        run: npm run test:poc
      - name: Build local and Railway containers
        run: |
          docker build -f infra/local/Dockerfile -t iop-setup:ci .
          docker build -f apps/api/Dockerfile -t iop-api:ci .
          docker build -f apps/web/Dockerfile -t iop-web:ci .
          docker build -f infra/railway/Dockerfile -t iop-railway:ci .
      - name: Exercise the Railway image with a synthetic private database
        run: node scripts/railway/check-container.cjs
      - name: Retain synthetic browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-${{ github.run_id }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  railway:
    needs: [change-scope, local-platform]
    if: >-
      github.ref == 'refs/heads/develop' &&
      ((github.event_name == 'push' &&
        needs.change-scope.outputs.runtime == 'true' &&
        vars.RAILWAY_AUTO_DEPLOY == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: railway-development
    concurrency:
      group: railway-development
      cancel-in-progress: false
    steps:
      - name: Check Railway deployment credential
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Configure the RAILWAY_TOKEN Actions secret with a development-scoped Railway project token."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install locked deployment tooling
        run: |
          npm install --global npm@10.9.2
          npm ci
          npm run build --workspace @iop/api
      - name: Publish validated development revision and verify live access
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_DATABASE_SERVICE_ID: ${{ vars.RAILWAY_DATABASE_SERVICE_ID }}
          IOP_PUBLIC_ORIGIN: ${{ vars.IOP_PUBLIC_ORIGIN }}
          IOP_VALIDATED_SHA: ${{ github.sha }}
        run: npm run railway:deploy
