name: iop-local

services:
  database:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: iop_local
      POSTGRES_USER: iop_bootstrap
      POSTGRES_PASSWORD: ${IOP_POSTGRES_PASSWORD:?Set IOP_POSTGRES_PASSWORD in your local .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U iop_bootstrap -d iop_local']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      IOP_TRANSPORT: container
      IOP_CONFIG_FILE: /app/config/poc.json
    volumes:
      - type: bind
        source: ./config/poc.local.json
        target: /app/config/poc.json
        read_only: true
        bind:
          create_host_path: false
    init: true
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(async r => { if (!r.ok || (await r.json()).status !== 'ok') process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
